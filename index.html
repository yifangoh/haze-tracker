<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #2d5a27; margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg width="260" height="340" viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A flower">
    <!-- stem -->
    <path d="M130 170 C125 230 135 280 130 330" stroke="#2f8f3a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M131 270 C170 250 195 255 205 235 C190 285 150 290 131 270 Z" fill="#3fae4b"/>
    <path d="M129 240 C95 220 70 225 58 205 C72 255 110 262 129 240 Z" fill="#3fae4b"/>
    <!-- petals -->
    <g transform="translate(130 100)" fill="#ff7eb6" stroke="#e0508f" stroke-width="2">
      <ellipse cx="0" cy="-48" rx="22" ry="40"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(45)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(90)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(135)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(180)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(225)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(270)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="40" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle cx="130" cy="100" r="26" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/>
  </svg>
</body>
</html>
